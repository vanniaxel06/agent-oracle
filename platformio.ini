; Agent Oracle — ESP32-2432S028R "Cheap Yellow Display"
;
; THREE ENVIRONMENTS, ONE PER BOARD REVISION. They are not interchangeable: the
; revisions ship different display controllers, and the board vendor does not
; mark which is which. Flash, look at the screen, pick the one that renders
; correctly — see docs/board-revisions.md. Symptom guide in short:
;
;   esp32-2432S028R    listed single-USB  ILI9341, no inversion  <-- CONFIRMED on
;                                         the units bought Aug 2026, WHICH HAVE
;                                         TWO USB PORTS. Do not infer revision
;                                         from port count; it is wrong.
;   esp32-2432S028Rv2  dual USB           ILI9341 + INVON (0x21) in its init
;   esp32-2432S028Rv3  dual USB           ST7789, RGB colour space
;
; A photo-negative screen means you are on the wrong one. Nothing is damaged by
; trying another; just reflash.
;
; Board definitions are vendored in boards/ rather than pulled as a submodule so
; that hardware config is pinned — see boards/README.md for provenance.

[platformio]
boards_dir = boards
default_envs = esp32-2432S028R

[env]
platform = espressif32
framework = arduino

; LVGL + Arduino + TLS overflows the default 1.3MB app partition (measured
; 1,418,497 bytes). min_spiffs gives 1.9MB per app slot and — critically — keeps
; TWO app slots, which is what makes OTA possible at all.
;
; Do NOT "fix" a size overflow with huge_app.csv. It offers 3MB but only ONE app
; partition, so the build succeeds, the unit flashes fine over USB, and OTA is
; silently dead forever after. On a device whose whole promise is not having to
; drive out to a client site to reflash it, that is the worst available failure.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
    ; Bump on every release you intend to push over the air. The device compares
    ; this against the manifest and will not re-flash an equal version.
    '-D FIRMWARE_VERSION="0.4.0"'

    ; The board definitions ask for a quarter-screen LVGL buffer — 240*320/4 =
    ; 19200 px = 38KB in ONE contiguous internal-RAM block. This app also carries
    ; TLS and WiFiManager, so that allocation fails on a board with no PSRAM:
    ;   E esp32_smartdisplay_dma.c: Failed to allocate DMA buffer
    ; The library then reports falling back to "direct transfers" and carries on
    ; as though it recovered — but nothing reaches the panel. The screen stays
    ; blank while the logs look survivable, which is a genuinely nasty failure to
    ; read: it looks exactly like a wrong display driver.
    ; A tenth of a screen (15KB) allocates fine and costs nothing here — this UI
    ; redraws a few text labels every 30 seconds, not animation.
    '-D LVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*DISPLAY_HEIGHT/10)'

    ; The board definition also reserves a 64KB DMA scratch buffer, permanently,
    ; for a screen that redraws text twice a minute. That starved the TLS
    ; handshake, which needs roughly 45KB of its own and failed with:
    ;   E ssl_client.cpp: (-32512) SSL - Memory allocation failed
    ;   W main.cpp: poll failed: HTTP -1
    ; — a failure that reads like the server is unreachable when the real problem
    ; is entirely local. 8KB is still ~12 screen rows per chunk, which is plenty
    ; for this UI, and it hands ~56KB back to TLS.
    ;
    ; Overriding by -D works because the later definition wins. Do NOT add -U to
    ; silence the redefinition warning: PlatformIO emits it after the -D and the
    ; macro ends up undefined, breaking the library build.
    '-D SMARTDISPLAY_DMA_BUFFER_SIZE=8192'

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/tzapu/WiFiManager.git

[env:esp32-2432S028R]
board = esp32-2432S028R

[env:esp32-2432S028Rv2]
board = esp32-2432S028Rv2

[env:esp32-2432S028Rv3]
board = esp32-2432S028Rv3
