; Agent Oracle — ESP32 status displays
;
; TWO FAMILIES OF BOARD:
;
; esp32-2432S028R(v2/v3) — "Cheap Yellow Display", THREE ENVIRONMENTS, ONE PER
; BOARD REVISION. They are not interchangeable: the revisions ship different
; display controllers, and the vendor does not mark which is which. Flash, look
; at the screen, pick the one that renders correctly — see
; docs/board-revisions.md. Symptom guide in short:
;
;   esp32-2432S028R    listed single-USB  ILI9341, no inversion  <-- CONFIRMED on
;                                         the units bought Aug 2026, WHICH HAVE
;                                         TWO USB PORTS. Do not infer revision
;                                         from port count; it is wrong.
;   esp32-2432S028Rv2  dual USB           ILI9341 + INVON (0x21) in its init
;   esp32-2432S028Rv3  dual USB           ST7789, RGB colour space
;
; A photo-negative screen means you are on the wrong one. Nothing is damaged by
; trying another; just reflash.
;
; esp32-4827S043C — ESP32-S3, 4.3" 480x272 RGB parallel panel, GT911 capacitive
; touch, 8MB PSRAM, 16MB flash.
;
; IT FLASHES OVER A CH340, NOT NATIVE USB, despite being an S3 and despite the
; board JSON carrying Espressif native-USB hwids (0x303A/0x1001) and
; use_1200bps_touch. Confirmed on hardware 26 Aug 2026: the USB-C port
; enumerates as USB-SERIAL CH340 (VID 1A86:7523) and `pio run -t upload` works
; through it normally. This was written up here as "native USB, no CH340" from
; the spec sheet before anyone plugged one in, and that was wrong — see
; docs/decisions.md.
;
; Native landscape: main.cpp picks rotation from the board's own
; DISPLAY_WIDTH/HEIGHT rather than assuming portrait — see the comment at
; lv_display_set_rotation(). No discrete RGB status LED on this board; the
; on-screen dot carries the colour instead, same as it always has.
;
; Board definitions are vendored in boards/ rather than pulled as a submodule so
; that hardware config is pinned — see boards/README.md for provenance.

[platformio]
boards_dir = boards
default_envs = esp32-2432S028R

[env]
platform = espressif32
framework = arduino

; LVGL + Arduino + TLS overflows the default 1.3MB app partition (measured
; 1,418,497 bytes). min_spiffs gives 1.9MB per app slot and — critically — keeps
; TWO app slots, which is what makes OTA possible at all.
;
; Do NOT "fix" a size overflow with huge_app.csv. It offers 3MB but only ONE app
; partition, so the build succeeds, the unit flashes fine over USB, and OTA is
; silently dead forever after. On a device whose whole promise is not having to
; drive out to a client site to reflash it, that is the worst available failure.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
    ; Bump on every release you intend to push over the air. The device compares
    ; this against the manifest and will not re-flash an equal version.
    '-D FIRMWARE_VERSION="0.5.0"'

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/tzapu/WiFiManager.git

; CYD-ONLY RAM WORKAROUNDS. These override the board definitions' buffer sizes
; and exist because the CYD has no PSRAM — every allocation competes with TLS
; for the same internal RAM. Applied only to the three CYD envs below via
; ${cyd_buffers.build_flags}; the S3 board has 8MB of PSRAM and its own board
; JSON already sizes its buffers for that, so it must NOT inherit these.
[cyd_buffers]
build_flags =
    ; The board definitions ask for a quarter-screen LVGL buffer — 240*320/4 =
    ; 19200 px = 38KB in ONE contiguous internal-RAM block. This app also carries
    ; TLS and WiFiManager, so that allocation fails on a board with no PSRAM:
    ;   E esp32_smartdisplay_dma.c: Failed to allocate DMA buffer
    ; The library then reports falling back to "direct transfers" and carries on
    ; as though it recovered — but nothing reaches the panel. The screen stays
    ; blank while the logs look survivable, which is a genuinely nasty failure to
    ; read: it looks exactly like a wrong display driver.
    ; A tenth of a screen (15KB) allocates fine and costs nothing here — this UI
    ; redraws a few text labels every 30 seconds, not animation.
    '-D LVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*DISPLAY_HEIGHT/10)'

    ; The board definition also reserves a 64KB DMA scratch buffer, permanently,
    ; for a screen that redraws text twice a minute. That starved the TLS
    ; handshake, which needs roughly 45KB of its own and failed with:
    ;   E ssl_client.cpp: (-32512) SSL - Memory allocation failed
    ;   W main.cpp: poll failed: HTTP -1
    ; — a failure that reads like the server is unreachable when the real problem
    ; is entirely local.
    ;
    ; 8KB was the first fix and it worked, but a row of text was once seen with
    ; its bottom clipped after a value changed length — consistent with narrow
    ; flush strips leaving part of the old area unredrawn. 16KB is ~24 screen rows
    ; per chunk, halves the number of strips, and still hands ~48KB back to TLS,
    ; which needs about 45KB and has been comfortable at 8KB with ~135KB free.
    ; If clipping ever returns, this is the first knob, not the last.
    ;
    ; Overriding by -D works because the later definition wins. Do NOT add -U to
    ; silence the redefinition warning: PlatformIO emits it after the -D and the
    ; macro ends up undefined, breaking the library build.
    '-D SMARTDISPLAY_DMA_BUFFER_SIZE=16384'

[env:esp32-2432S028R]
board = esp32-2432S028R
build_flags = ${env.build_flags} ${cyd_buffers.build_flags}

[env:esp32-2432S028Rv2]
board = esp32-2432S028Rv2
build_flags = ${env.build_flags} ${cyd_buffers.build_flags}

[env:esp32-2432S028Rv3]
board = esp32-2432S028Rv3
build_flags = ${env.build_flags} ${cyd_buffers.build_flags}

; PSRAM board — no buffer overrides. LVGL_BUFFER_PIXELS and
; SMARTDISPLAY_DMA_BUFFER_SIZE come from boards/esp32-4827S043C.json as
; fetched, sized for a full-frame PSRAM buffer on a chip with no TLS/PSRAM
; contention to work around.
[env:esp32-4827S043C]
board = esp32-4827S043C
build_flags =
    ${env.build_flags}

    ; PIXEL CLOCK RAISED FROM THE BOARD DEFINITION'S 8MHz.
    ;
    ; An RGB panel has no controller memory - it is refreshed continuously from
    ; the framebuffer, so the pixel clock IS the refresh rate. At the board
    ; definition's 8MHz, with this panel's blanking porches:
    ;   h_total = 480 + 4 + 43 + 8 = 535
    ;   v_total = 272 + 4 + 12 + 8 = 296
    ;   8000000 / (535 * 296) = 50.5 Hz
    ; which is visible flicker, and was seen as such on the first unit within a
    ; minute of it being powered. 50Hz is worst in peripheral vision, which is
    ; precisely how a wall-mounted status display gets looked at.
    ;
    ; MEASURED ON HARDWARE. DO NOT RAISE WITHOUT RE-CHECKING:
    ;   8MHz  = 50.5 Hz - obvious flicker, EVEN ACROSS THE WHOLE PANEL
    ;   12MHz = 75.8 Hz - best observed; faint residual only
    ;   16MHz = 101 Hz  - flicker returns, but only at the RIGHT EDGE
    ;
    ; That last measurement is the useful one. Flicker spread evenly across the
    ; panel is refresh rate, and raising this fixes it. Flicker localised to the
    ; RIGHT EDGE is the DMA falling behind toward the END OF EACH SCANLINE -
    ; under-run - and raising this makes it WORSE. Going to 16MHz cured one
    ; fault and bought the other, which is how we know 12MHz is near the ceiling.
    ;
    ; The ceiling is PSRAM bandwidth. The LCD peripheral DMAs the framebuffer
    ; straight out of PSRAM (FB_IN_PSRAM=true) and this library does NOT expose
    ; bounce buffers, so the panel reads ~24MB/s continuously while wifi and TLS
    ; also want PSRAM. Past this point the clock is the wrong knob; bounce
    ; buffers are the actual fix - see docs/decisions.md.
    ;
    ; ALWAYS ASK WHERE ON THE SCREEN the flicker is before touching this. The
    ; two faults sound identical described out loud and have opposite fixes.
    '-D ST7262_PANEL_CONFIG_TIMINGS_PCLK_HZ=(12*1000000)'
