<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Agent Oracle</title>
  <desc id="hero-d">ESP32 displays that show whether an AI agent is actually alive. Two walnut-cased screens: one green and reading OK, one red and reading NO HEARTBEAT.</desc>
  <defs>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76543b"/>
      <stop offset="1" stop-color="#4a3221"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="26" fill="#0b0c0d"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="25.5" fill="none" stroke="#2b2d31"/>

  <g id="title-block">
    <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8f8b84">esp32 firmware  /  reference server included</text>
    <text x="60" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-2.5" fill="#ece8df">Agent Oracle</text>
    <text x="64" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#ece8df">ESP32 displays that show whether</text>
    <text x="64" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#ece8df">an AI agent is actually alive.</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8f8b84">polls GET /status/{key} every 30 s</text>
    <text x="64" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8f8b84">never green from an old beat</text>
  </g>
  <g id="heartbeat" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="3">
    <path d="M64 420 L78 420 L86 398 L96 438 L104 420 L128 420 L142 420 L150 398 L160 438 L168 420 L192 420 L206 420 L214 398 L224 438 L232 420 L256 420 L270 420 L278 398 L288 438 L296 420 L320 420 L334 420 L342 398 L352 438 L360 420 L384 420" stroke="#22C55E" stroke-opacity="0.85"/>
    <path d="M384 420 L 600 420" stroke="#EF4444"/>
    <circle cx="600" cy="420" r="6" fill="#EF4444" stroke="none"/>
  </g>
  <g id="units">
<g transform="translate(660 38) rotate(-2 153.6 119.2)">
