<text x="10" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8A8A8A">beat 12s ago  -  fw 0.5.5</text>

  </g>
  <rect width="307.2" height="238.4" rx="12" fill="none" stroke="#fff" stroke-opacity="0.07"/>
</g>
