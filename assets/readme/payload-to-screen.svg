<text x="92" y="377" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve"><tspan fill="#8f8b84" xml:space="preserve">    { </tspan><tspan fill="#8f8b84" xml:space="preserve">"l"</tspan><tspan fill="#8f8b84" xml:space="preserve">: </tspan><tspan fill="#ece8df" xml:space="preserve">"Failures"</tspan><tspan fill="#8f8b84" xml:space="preserve">, </tspan><tspan fill="#8f8b84" xml:space="preserve">"v"</tspan><tspan fill="#8f8b84" xml:space="preserve">: </tspan><tspan fill="#ece8df" xml:space="preserve">"0"</tspan><tspan fill="#8f8b84" xml:space="preserve"> }</tspan></text>
