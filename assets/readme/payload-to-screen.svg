<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="flow-t flow-d">
  <title id="flow-t">One JSON payload becomes one screen</title>
  <desc id="flow-d">A trimmed status payload with a title, state word, colour, three label and value lines and an age, next to the panel that draws it: the title top left, the state word and dot in the colour sent, the lines as rows, and the age in the footer. Nothing is decided on the device.</desc>
  <defs>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76543b"/>
      <stop offset="1" stop-color="#4a3221"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="590" rx="26" fill="#0b0c0d"/>
  <rect x="0.5" y="0.5" width="1199" height="589" rx="25.5" fill="none" stroke="#2b2d31"/>

  <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8f8b84">GET /status/{key}  ->  200</text>
  <text x="752" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8f8b84">the 320 x 240 panel</text>
  <rect x="64" y="112" width="590" height="388" rx="16" fill="#141517" stroke="#2b2d31"/>
  <g id="payload">
<text x="92" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve"><tspan fill="#ece8df" xml:space="preserve">{</tspan></text>
