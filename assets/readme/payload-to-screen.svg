<text x="92" y="439" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve"><tspan fill="#8f8b84" xml:space="preserve">  "age"</tspan><tspan fill="#8f8b84" xml:space="preserve">: </tspan><tspan fill="#ece8df" xml:space="preserve">"12s"</tspan></text>
<text x="92" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve"><tspan fill="#ece8df" xml:space="preserve">}</tspan></text>
