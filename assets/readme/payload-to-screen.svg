<text x="92" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve"><tspan fill="#8f8b84" xml:space="preserve">  "state"</tspan><tspan fill="#8f8b84" xml:space="preserve">: </tspan><tspan fill="#ece8df" xml:space="preserve">"OK"</tspan><tspan fill="#8f8b84" xml:space="preserve">,</tspan></text>
<text x="92" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve"><tspan fill="#8f8b84" xml:space="preserve">  "color"</tspan><tspan fill="#8f8b84" xml:space="preserve">: </tspan><tspan fill="#22C55E" xml:space="preserve">"green"</tspan><tspan fill="#8f8b84" xml:space="preserve">,</tspan></text>
